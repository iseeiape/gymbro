<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitnessPro OG Image</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 50%, #be185d 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: white;
    }
    .logo {
      font-size: 96px;
      font-weight: 900;
      background: linear-gradient(90deg, #c084fc, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 20px;
    }
    .subtitle {
      font-size: 42px;
      font-weight: 600;
      color: #e9d5ff;
      margin-bottom: 15px;
    }
    .description {
      font-size: 28px;
      color: #c4b5fd;
    }
    .badge {
      position: absolute;
      bottom: 40px;
      background: rgba(255,255,255,0.1);
      padding: 12px 30px;
      border-radius: 50px;
      font-size: 22px;
      color: #fcd34d;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="logo">💪 FitnessPro</div>
  <div class="subtitle">Generator Program Antrenament</div>
  <div class="description">Full Body • Upper/Lower • Push/Pull/Legs</div>
  <div class="badge">✨ Gratuit • Personalizat • Profesional</div>
</body>
</html>
